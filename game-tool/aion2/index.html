  <script>
    const translations = {

        inputs: [

          "가슴 크기", "가슴 위치 (가로축)", "광배",
          "허리 둘레", "허리 길이", "배 나온 정도",
          "골반 크기", "엉덩이 크기", "엉덩이 높이",
          "허벅지 길이", "종아리 길이"
        ],
        outputs: [
          "키", "컵 사이즈 (일본 기준)", "가슴둘레","밑가슴둘레", "허리둘레", "엉덩이둘레"
        ]
      },
      "zh-TW": {
        title: "AION2 女性角色三圍預測",
        language: "語言",
        inputTitle: "遊戲內設定值（18 個項目:機器翻譯）",
        outputTitle: "計算結果",
        memo: "備註",
        memoPlaceholder: "請輸入備註（限 100 字以內）",
        memoCount: "{count}/100 字",
        saveButton: "儲存計算結果（TXT 格式）",
        inputSection: "【輸入項目】",
        outputSection: "【計算結果】",
        calculationDetails: "計算方法詳情請見：",
        link: "查看詳情",
        memoSection: "【備註】",
        cup: "罩杯（日本標準）",
        inputs: [
          "身高", "體格", "身體厚度", "頭部大小",
          "頸部長度", "胸廓大小", "胸廓長度",
          "胸部大小", "胸部位置（水平軸）", "闊背肌",
          "腰部粗細", "腰部長度", "腹部突出程度",
          "骨盆大小", "臀部大小", "臀部高度",
          "大腿長度", "小腿長度"
        ],
        outputs: [
          "身高", "罩杯（日本標準）", "上胸圍","下胸圍", "腰圍", "臀圍"
        ]
      }
    };
    let currentLanguage = "ja";

    function t(key) {
      return translations[currentLanguage][key];
    }
    // 入力値を保持
    const inputValues = Array(18).fill(0);
    // 入力スライダーと自由入力欄
    function createInputs() {
      const container = document.getElementById("inputs");

      container.innerHTML = inputValues.map((value, i) => `
        <div class="input-item">
          <div class="input-heading">
            <label for="number${i}" data-input-label="${i}">
              ${translations[currentLanguage].inputs[i]}
            </label>

            <input
              type="number"
              id="number${i}"
              min="0"
              max="100"
              step="1"
              value="${value}"
            >
          </div>
          <div class="input-controls">
            <input
              type="range"
              id="slider${i}"
              min="0"
              max="100"
              step="1"
              value="${value}"
            >
          </div>
        </div>
      `).join("");

      inputValues.forEach((_, i) => {
        const slider = document.getElementById(`slider${i}`);
        const number = document.getElementById(`number${i}`);
        // 値を補正して、スライダー・入力欄・内部データを同期
        function updateValue(rawValue) {
          if (rawValue === "") return;
          let value = Number(rawValue);
          if (!Number.isFinite(value)) return;
          value = Math.floor(value);
          value = Math.max(0, Math.min(100, value));
          inputValues[i] = value;
          slider.value = value;
          number.value = value;
          calculate();
        }
        slider.addEventListener("input", () => {
          updateValue(slider.value);
        });
        number.addEventListener("input", () => {
          if (number.value === "") return;

          updateValue(number.value);
        });
        // 空欄は0にする
        number.addEventListener("change", () => {
          if (number.value === "") {
            updateValue("0");
          }
        });
      });
    }
    const memoInput = document.getElementById("memo");
    const memoCount = document.getElementById("memoCount");
    memoInput.addEventListener("input", updateMemoCount);
    
    //計算処理
    // 身長
    function calculateStature() {
      const statureInpt = [
        inputValues[0],	//身長
        inputValues[1],	//体格
        inputValues[3],	//頭の大きさ
        inputValues[4],	//首の長さ
        inputValues[6],	//胸郭の長さ
        inputValues[11],	//腰の長さ
        inputValues[16],	//太ももの長さ
        inputValues[17],	//ふくらはぎの長さ
      ];
      const statureRate = 1 + statureInpt[0] / (100 * 2);
      const bodyMassRate = 1 + statureInpt[1] / (100 * 2);
      const calcs = [
        15*(1+statureInpt[2]/(100*10))*(statureRate/bodyMassRate),
        5*(1+statureInpt[3]/(100*1.5))*(statureRate/bodyMassRate),
        10*(1+statureInpt[4]/(100*2))*(statureRate/bodyMassRate),
        10*(1+statureInpt[5]/(100*3))*(statureRate/bodyMassRate),
        30*(1+statureInpt[6]/(100*5))*(statureRate/bodyMassRate),
        30*(1+statureInpt[7]/(100*5))*(statureRate/bodyMassRate),
        20*(statureRate/bodyMassRate)
      ]
      return calcs.reduce((sum, element) => sum + element, 0);
    }
    // バスト
    function calculateBust() {
      const bustInpt = [
        inputValues[0],	//身長
        inputValues[1],	//体格
        inputValues[2],	//体の太さ
        inputValues[5],	//胸郭の大きさ
        inputValues[6],	//胸郭の長さ
        inputValues[7],	//胸部の大きさ
        inputValues[8],	//胸の位置
        inputValues[9],	//広背筋
      ];
      //背面半周計算
      const statureRateWBack = 1 + bustInpt[0] / (100 * 3.5);
      const bodyMassRateWBack = (1 + bustInpt[1] / (100 * 2))**2;
      const bodyWidthRateWBack = 1 + bustInpt[2] / (100 * 1.5);
      const calcsWidthBack = statureRateWBack * bodyMassRateWBack * bodyWidthRateWBack * ((1.2*(1+bustInpt[3]/100))+(1.7*(1+bustInpt[4]/100))+(0.2*(1+bustInpt[7]/100))+2);
      const statureRateDBack = 1 + bustInpt[0] / (100 * 3.5);
      const bodyMassRateDBack = 1 + bustInpt[1] / (100 * 1.5);
      const bodyWidthRateDBack = 1 + bustInpt[2] / (100 * 1.5);
      const calcsDepthBack = statureRateDBack * bodyMassRateDBack * bodyWidthRateDBack * ((1.2*(1+bustInpt[3]/100))+(0.8*(1+bustInpt[4]/100))+2);
      const ovalCirculBack = (Math.PI*(calcsWidthBack+calcsDepthBack))*(1+(3*((calcsWidthBack-calcsDepthBack)/(calcsWidthBack+calcsDepthBack))**2/(10+ Math.sqrt(4-3*((calcsWidthBack-calcsDepthBack)/(calcsWidthBack+calcsDepthBack))**2))));   
      //前面半周計算
      const statureRateWFront = 1 + bustInpt[0] / (100 * 2.7);
      const bodyMassRateWFront = 1 + bustInpt[1] / (100 * 5);
      const bodyWidthRateWFront = 1 + bustInpt[2] / (100 * 2);
      const calcsWidthFront = statureRateWFront * bodyMassRateWFront * bodyWidthRateWFront * ((1.3*(1+bustInpt[3]/100))+(1.3*(1+bustInpt[4]/100))+(2*(1+2*bustInpt[5]/100)*(1+(bustInpt[6]/(100*2))**2))+3);
      const statureRateDFront = 1 + bustInpt[0] / (100 * 2.7);
      const bodyMassRateDFront = 1 + bustInpt[1] / (100 * 5);
      const bodyWidthRateDFront = 1 + bustInpt[2] / (100 * 3);
      const calcsDepthFront = statureRateDFront * bodyMassRateDFront * bodyWidthRateDFront * ((1*(1+bustInpt[3]/100))+(1*(1+bustInpt[4]/100))+(2*(1+2*bustInpt[5]/100))+3);
      const ovalCirculFront = (Math.PI*(calcsWidthFront+calcsDepthFront))*(1+(3*((calcsWidthFront-calcsDepthFront)/(calcsWidthFront+calcsDepthFront))**2/(10+ Math.sqrt(4-3*((calcsWidthFront-calcsDepthFront)/(calcsWidthFront+calcsDepthFront))**2))));
      //長方形周長(calcsWidth,calcsDepthは半径なので注意)
      const rectangleCirculFront = calcsWidthFront*4+calcsDepthFront*4;
      backCircul = ovalCirculBack/2;
      frontCircul = (0.75*rectangleCirculFront+0.25*ovalCirculFront)/2
      return frontCircul+backCircul;
    }
    
    //カップ
    function calculateCup(bust, underBust) {
      const diff = bust - underBust;
      //AION2のモデル形状的にたぶんAAが出るのはバグ(計算の倍率等が適正でない)
      if (diff < 10) {
        return "AA";
      }
      const index = Math.floor((diff - 10) / 2.5);
      // A～Z（A=0, B=1, ..., Z=25）
      const cupIndex = Math.min(index, 25);
      return String.fromCharCode("A".charCodeAt(0) + cupIndex);
    }

    // アンダー
    function calculateUnderbust() {
      const underInpt = [
        inputValues[0],		//身長
        inputValues[1],		//体格
        inputValues[2],		//体の太さ
        inputValues[5],	//胸郭の大きさ
        inputValues[6],	//胸郭の長さ
        inputValues[9],	//広背筋
      ];
      const statureRateW = 1 + underInpt[0] / (100 * 3.5);
      const bodyMassRateW = (1 + underInpt[1] / (100 * 2))**2;
      const bodyWidthRateW = 1 + underInpt[2] / (100 * 1.5);
      const calcsWidth = statureRateW * bodyMassRateW * bodyWidthRateW *
              ((1.2*(1+underInpt[3]/100))+(1.7*(1+underInpt[4]/100))+(0.2*(1+underInpt[5]/100))+2);
      const statureRateD = 1 + underInpt[0] / (100 * 3.5);
      const bodyMassRateD = 1 + underInpt[1] / (100 * 1.5);
      const bodyWidthRateD = 1 + underInpt[2] / (100 * 1.5);
      const calcsDepth = statureRateD * bodyMassRateD * bodyWidthRateD *
              ((1.2*(1+underInpt[3]/100))+(0.8*(1+underInpt[4]/100))+2);
      const result = (Math.PI*(calcsWidth+calcsDepth))*(1+(3*((calcsWidth-calcsDepth)/(calcsWidth+calcsDepth))**2/(10+ Math.sqrt(4-3*((calcsWidth-calcsDepth)/(calcsWidth+calcsDepth))**2))));
      return result;
    }

    // ウエスト
    function calculateWaist() {
      const waistInpt = [
        inputValues[0],	//身長
        inputValues[1],	//体格
        inputValues[2],	//体の太さ
        inputValues[10],	//腰の太さ
        inputValues[12],	//お腹の突出具合
      ];
      const statureRateW = 1 + waistInpt[0] / (100 * 1);
      const bodyMassRateW = 1 + waistInpt[1] / (100 * 1);
      const bodyWidthRateW = 1 + waistInpt[2] / (100 * 4);
      const calcsWidth = statureRateW * bodyMassRateW * bodyWidthRateW *
              ((2.5*(1+waistInpt[3]/100))+(1*(1+waistInpt[4]/100)*bodyMassRateW)+1.3);
      const statureRateD = 1 + waistInpt[0] / (100 * 2.5);
      const bodyMassRateD = 1 + waistInpt[1] / (100 * 1.5);
      const bodyWidthRateD = 1 + waistInpt[2] / (100 * 6);
      const calcsDepth = statureRateD * bodyMassRateD * bodyWidthRateD * ((2*(1+waistInpt[4]/100)*bodyMassRateW)+1.3);
      const result = (Math.PI*(calcsWidth+calcsDepth))*(1+(3*((calcsWidth-calcsDepth)/(calcsWidth+calcsDepth))**2/(10+ Math.sqrt(4-3*((calcsWidth-calcsDepth)/(calcsWidth+calcsDepth))**2))));
      return result;
    }

    // ヒップ
    function calculateHips() {
      const hipsInpt = [
        inputValues[0],	//身長
        inputValues[1],	//体格
        inputValues[2],	//体の太さ
        inputValues[13],	//骨盤の大きさ
        inputValues[14],	//お尻の大きさ
        inputValues[15],	//お尻の高さ
      ];
      const statureRateW = 1 + hipsInpt[0] / (100 * 2);
      const bodyMassRateW = 1 + hipsInpt[1] / (100 * 3);
      const bodyWidthRateW = 1 + hipsInpt[2] / (100 * 1.5);
      const calcsWidth = statureRateW * bodyMassRateW * bodyWidthRateW * ((4.5*(1+hipsInpt[3]/100))+(-0.25*(1+hipsInpt[5]/100))+4);
      const statureRateD = 1 + hipsInpt[0] / (100 * 2);
      const bodyMassRateD = 1 + hipsInpt[1] / (100 * 1.5);
      const bodyWidthRateD = 1 + hipsInpt[2] / (100 * 1.5);
      const calcsDepth = statureRateD * bodyMassRateD * bodyWidthRateD * ((2.5*(1+hipsInpt[4]/100))+3);
      const ovalCircul = (Math.PI*(calcsWidth+calcsDepth))*(1+(3*((calcsWidth-calcsDepth)/(calcsWidth+calcsDepth))**2/(10+ Math.sqrt(4-3*((calcsWidth-calcsDepth)/(calcsWidth+calcsDepth))**2))));
      //長方形周長(calcsWidth,calcsDepthは半径なので注意)
      const rectangleCircul = calcsWidth*4+calcsDepth*4;
      return 0.75*ovalCircul+0.25*rectangleCircul;
    }

    function calculate() {
      const bust =  calculateBust();
      const under = calculateUnderbust();
      const results = [
        calculateStature(),
        calculateCup(bust,under),
        bust,
        under,
        calculateWaist(),
        calculateHips()
      ];
      renderOutputs(results);
    }

    // 結果を表示
    function renderOutputs(results) {
      document.getElementById("outputs").innerHTML =
        results.map((value, i) => {
          const displayValue =
            typeof value === "number" ? value.toFixed(1) : value;

          return `
            <div class="output-item">
              <span class="output-label">
                ${translations[currentLanguage].outputs[i]}
              </span>
              <span class="output-value">${displayValue}</span>
            </div>
          `;
        }).join("");
    }
    
    function saveResults() {
      // 計算結果を取得
      bust =  calculateBust();
      under = calculateUnderbust();
      const results = [
        calculateStature(),
        calculateCup(bust,under),
        bust,
        under,
        calculateWaist(),
        calculateHips()
      ];

      // 数値・文字列の両方に対応した表示形式
      function formatValue(value) {
        if (typeof value === "number") {
          return Number.isFinite(value) ? value.toFixed(2) : String(value);
        }
        return String(value ?? "");
      }

      // TXT本文を作成
      const dict = translations[currentLanguage];
      const inputs = dict.inputs.map((name, i) => ({
        name,
        value: inputValues[i]
      }));
      const outputs = dict.outputs.map((name, i) => ({
        name,
        value: results[i]
      }));
      const lines = [
        dict.inputSection,
        ...inputs.map(item =>
          `${item.name}: ${formatValue(item.value)}`
        ),
        "",
        dict.outputSection,
        ...outputs.map(item =>
          `${item.name}: ${formatValue(item.value)}`
        ),
        "",
        dict.memoSection,
        memoInput.value
      ];

      const text = lines.join("\r\n");

      // TXTファイルを作成
      const blob = new Blob(
        ["\uFEFF", text],
        { type: "text/plain;charset=utf-8" }
      );

      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");

      // ファイル名に日時を設定
      const now = new Date();
      const timestamp = [
        now.getFullYear(),
        String(now.getMonth() + 1).padStart(2, "0"),
        String(now.getDate()).padStart(2, "0"),
        "_",
        String(now.getHours()).padStart(2, "0"),
        String(now.getMinutes()).padStart(2, "0"),
        String(now.getSeconds()).padStart(2, "0")
      ].join("");

      link.href = url;
      link.download = `aion2_3size_${timestamp}.txt`;

      document.body.appendChild(link);
      link.click();
      link.remove();

      // ダウンロード開始後にURLを解放
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
    
    function applyLanguage(language) {
      if (!translations[language]) return;
      currentLanguage = language;
      const dict = translations[language];
      document.documentElement.lang = language;
      document.querySelector("[data-i18n='title']").textContent = dict.title;
      document.querySelector("[data-i18n='language']").textContent = dict.language;
      document.querySelector(".panel h2").textContent = dict.inputTitle;
      document.querySelectorAll(".panel h2")[1].textContent = dict.outputTitle;
      document.querySelector(".memo-area label").textContent = dict.memo;
      document.querySelector(
        "[data-i18n='calculationDetails']"
      ).textContent = dict.calculationDetails;
      document.querySelector(
        "[data-i18n='link']"
      ).textContent = dict.link;
      memoInput.placeholder = dict.memoPlaceholder;
      document.getElementById("saveButton").textContent = dict.saveButton;
      document.querySelectorAll("[data-input-label]").forEach(label => {
        const i = Number(label.dataset.inputLabel);
        label.textContent = dict.inputs[i];
      });
      inputValues.forEach((_, i) => {
        const label = dict.inputs[i];
        document.getElementById(`number${i}`).setAttribute(
          "aria-label", `${label} - ${language === "ja" ? "数値入力" :
            language === "ko" ? "숫자 입력" :
            language === "zh-TW" ? "數值輸入" : "Number input"}`
        );

        document.getElementById(`slider${i}`).setAttribute(
          "aria-label", `${label} - ${language === "ja" ? "スライダー" :
            language === "ko" ? "슬라이더" :
            language === "zh-TW" ? "滑桿" : "Slider"}`
        );
      });
      updateMemoCount();
      calculate();
    }

    function updateMemoCount() {
      const count = [...memoInput.value].length;
      memoCount.textContent = count;
      document.getElementById("memoCountSuffix").textContent =
        t("memoCount").replace("{count}", "").trim();
    }
    document.getElementById("languageSelect").addEventListener(
      "change",
      event => applyLanguage(event.target.value)
    );
    // 初期表示
    createInputs();
    calculate();
  </script>
</body>
</html>
